<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorly - Výsledky a Živé vysielanie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-dark: #001e28;
            --bg-light: #f1f5f9;
            --primary-red: #e62020;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
            --border-color: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding-bottom: 70px; }

        .top-header { background-color: var(--bg-dark); color: var(--text-light); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .top-header .left { display: flex; align-items: center; gap: 15px; font-size: 18px; font-weight: bold; }
        .top-header .right { display: flex; gap: 15px; font-size: 18px; }
        
        .date-strip { background: white; display: flex; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        .date-strip::-webkit-scrollbar { display: none; }
        .date-item { padding: 0 15px; text-align: center; font-size: 12px; color: #666; font-weight: bold; cursor: pointer; }
        .date-item.active { color: var(--primary-red); border-bottom: 2px solid var(--primary-red); padding-bottom: 5px; }

        .banner { background: #007aff; color: white; text-align: center; padding: 10px; font-size: 14px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .banner button { background: #ff9900; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .category-header { background: #fff3cd; padding: 8px 15px; font-size: 12px; font-weight: bold; color: #856404; text-transform: uppercase; margin-top: 10px; }
        .match-row { background: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .match-row:active { background: #f9f9f9; }
        .team-info { display: flex; flex-direction: column; gap: 5px; font-weight: 500; }
        .score-info { display: flex; flex-direction: column; gap: 5px; text-align: right; font-weight: bold; }
        .match-time { font-size: 12px; color: var(--primary-red); width: 45px; }

        #match-detail { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-light); z-index: 200; display: none; overflow-y: auto; }
        .detail-header { background: var(--bg-dark); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .detail-time { text-align: center; padding: 15px; font-size: 14px; color: #666; font-weight: bold; }
        
        .score-board { display: flex; justify-content: space-around; align-items: center; padding: 20px; background: white; margin: 0 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .team-card { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 30%; text-align: center; font-weight: bold; }
        .team-card .flag { width: 50px; height: 50px; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid #ddd; }
        .main-score { font-size: 32px; font-weight: bold; }

        .tabs { display: flex; background: white; margin-top: 15px; border-bottom: 1px solid var(--border-color); }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: bold; color: #666; text-transform: uppercase; cursor: pointer; }
        .tab.active { color: var(--primary-red); border-bottom: 3px solid var(--primary-red); }

        .events-list { padding: 15px; background: white; }
        .event-item { padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #666; text-decoration: none; cursor: pointer; gap: 4px; }
        .nav-item.active { color: var(--primary-red); }
        .nav-item i { font-size: 20px; }

        #audio-status { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--primary-red); color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; z-index: 150; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="left">
            <i class="fa-solid fa-bars"></i>
            <span><i class="fa-solid fa-hockey-puck"></i> Hokej <i class="fa-solid fa-caret-down"></i></span>
        </div>
        <div class="right">
            <i class="fa-solid fa-gift"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-user"></i>
        </div>
    </header>

    <div class="date-strip">
        <div class="date-item">PI<br>6.11.</div>
        <div class="date-item">SO<br>7.11.</div>
        <div class="date-item">NE<br>8.11.</div>
        <div class="date-item active">DNES<br>9.11.</div>
        <div class="date-item">UT<br>10.11.</div>
        <div class="date-item">ST<br>11.11.</div>
        <div class="date-item">ŠT<br>12.11.</div>
    </div>

    <div class="banner">
        Tipsport 20 € zadarmo len za registráciu 18+ <button>REGISTROVAŤ</button>
    </div>

    <div id="matches-container">
        <div style="padding: 15px; text-align: center; color: #666;">Načítavam zápasy...</div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-field-pitch"></i>Zápasy</div>
        <div class="nav-item"><i class="fa-solid fa-satellite-dish"></i>LIVE</div>
        <div class="nav-item"><i class="fa-regular fa-star"></i>Obľúbené</div>
        <div class="nav-item"><i class="fa-solid fa-trophy"></i>Ligy</div>
    </nav>

    <div id="match-detail">
        <div class="detail-header">
            <i class="fa-solid fa-arrow-left" onclick="closeDetail()" style="font-size: 20px; cursor: pointer;"></i>
            <span><i class="fa-solid fa-hockey-puck"></i> Hokej</span>
            <div style="display:flex; gap:15px;">
                <i class="fa-solid fa-share-nodes"></i>
                <i class="fa-regular fa-bell"></i>
            </div>
        </div>

        <div class="detail-time" id="det-date">09.11.2026</div>

        <div class="score-board">
            <div class="team-card">
                <div class="flag"><i class="fa-solid fa-shield-halved"></i></div>
                <span id="det-home">Domáci</span>
            </div>
            <div class="main-score" id="det-score">- : -</div>
            <div class="team-card">
                <div class="flag"><i class="fa-solid fa-shield-halved"></i></div>
                <span id="det-away">Hostia</span>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active">PREHĽAD</div>
            <div class="tab">H2H</div>
            <div class="tab">TABUĽKA</div>
        </div>

        <div class="events-list" id="det-events">
            <div style="text-align:center; color:#999; padding:20px;">Žiadne udalosti</div>
        </div>
    </div>

    <audio id="live-audio" autoplay></audio>
    <div id="audio-status"><i class="fa-solid fa-volume-high"></i> <span id="audio-label">Živý Komentár Aktívny</span></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrbho9N3nrFwPyj9tNylBNh8fZ2MqBeHY",
            authDomain: "scorely-fff98.firebaseapp.com",
            databaseURL: "https://scorely-fff98-default-rtdb.firebaseio.com",
            projectId: "scorely-fff98",
            storageBucket: "scorely-fff98.firebasestorage.app",
            messagingSenderId: "1094795512385",
            appId: "1:1094795512385:web:2c4785b37cc7063bac14c0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('matches').on('value', snap => {
            const matches = snap.val() || {};
            const container = document.getElementById('matches-container');
            container.innerHTML = '<div class="category-header">OBLÚBENÉ SÚŤAŽE / DNES</div>';

            for (let id in matches) {
                const m = matches[id];
                const row = document.createElement('div');
                row.className = 'match-row';
                row.onclick = () => openDetail(m);
                
                row.innerHTML = `
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <div class="match-time">${m.status === 'LIVE' ? `<span style="color:var(--primary-red)">${m.time}'</span>` : m.status}</div>
                        <div class="team-info">
                            <span>${m.teamHome}</span>
                            <span>${m.teamAway}</span>
                            ${m.commentating ? '<span style="font-size:10px; color:var(--primary-red); font-weight:bold;"><i class="fa-solid fa-microphone"></i> Prebieha komentár</span>' : ''}
                        </div>
                    </div>
                    <div class="score-info">
                        <span style="color: ${m.status === 'LIVE' ? 'var(--primary-red)' : '#000'}">${m.scoreHome}</span>
                        <span style="color: ${m.status === 'LIVE' ? 'var(--primary-red)' : '#000'}">${m.scoreAway}</span>
                    </div>
                `;
                container.appendChild(row);
            }
        });

        function openDetail(match) {
            document.getElementById('match-detail').style.display = 'block';
            document.getElementById('det-home').innerText = match.teamHome;
            document.getElementById('det-away').innerText = match.teamAway;
            document.getElementById('det-score').innerText = `${match.scoreHome} : ${match.scoreAway}`;
            document.getElementById('det-date').innerText = match.date || '09.11.2026';
            
            const evContainer = document.getElementById('det-events');
            evContainer.innerHTML = '';
            if(match.events && match.events.length > 0) {
                match.events.forEach(ev => {
                    evContainer.innerHTML += `<div class="event-item"><strong>${ev.time}'</strong> - ${ev.text}</div>`;
                });
            } else {
                evContainer.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">Žiadne udalosti</div>';
            }
        }
        function closeDetail() { document.getElementById('match-detail').style.display = 'none'; }

        let peerConnected = false;
        document.body.addEventListener('click', () => {
            if(!peerConnected) {
                initAudioReceiver();
                peerConnected = true;
            }
        }, {once: true});

        function initAudioReceiver() {
            const peer = new Peer();
            peer.on('open', () => {
                const call = peer.call('scorly-admin-studio', null); 
                call.on('stream', remoteStream => {
                    const audioEl = document.getElementById('live-audio');
                    audioEl.srcObject = remoteStream;
                    document.getElementById('audio-status').style.display = 'block';
                });
                call.on('close', () => {
                    document.getElementById('audio-status').style.display = 'none';
                });
            });
        }
    </script>
</body>
</html>
