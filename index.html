<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorly - Živé Výsledky & Audio Komentár</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #111418;
            --bg-card: #1c2127;
            --bg-header: #0d0f12;
            --accent-red: #e00000;
            --accent-live: #00e676;
            --text-main: #f0f2f5;
            --text-muted: #8c9ba5;
            --border-color: #2a313a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--bg-header);
            border-bottom: 2px solid var(--accent-red);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo span { color: var(--accent-red); }

        .admin-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-card);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .admin-link:hover {
            color: #fff;
            border-color: var(--accent-red);
        }

        .nav-categories {
            background: var(--bg-card);
            display: flex;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            padding: 0 10px;
        }

        .cat-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
        }

        .cat-btn.active {
            color: #fff;
            border-bottom-color: var(--accent-red);
        }

        .live-player-bar {
            background: linear-gradient(90deg, #1f1214 0%, #161a22 100%);
            border: 1px solid var(--accent-red);
            margin: 15px auto;
            max-width: 800px;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-live);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-live);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        .league-group {
            background: var(--bg-card);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            overflow: hidden;
        }

        .league-header {
            background: rgba(255,255,255,0.03);
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .match-row {
            display: grid;
            grid-template-columns: 70px 1fr 60px;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .match-row:last-child { border-bottom: none; }

        .match-status {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .match-status.live {
            color: var(--accent-live);
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .score {
            font-size: 16px;
            font-weight: 800;
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-bolt"></i> SCOR<span>LY</span></div>
        <a href="admin.html" class="admin-link"><i class="fa-solid fa-lock"></i> Admin Rozhranie</a>
    </header>

    <div class="nav-categories">
        <button class="cat-btn active">VŠETKO</button>
        <button class="cat-btn">ŽIVÉ</button>
        <button class="cat-btn">FUTBAL</button>
        <button class="cat-btn">HOKEJ</button>
    </div>

    <div class="container">
        <div class="live-player-bar">
            <div class="player-info">
                <div class="live-dot"></div>
                <div>
                    <div style="font-size:12px; color:var(--text-muted);">ŽIVÝ AUDIO KOMENTÁR</div>
                    <div id="broadcast-status-text" style="font-size:14px; font-weight:700;">Vysielanie je pripravené</div>
                </div>
            </div>
            <button onclick="toggleAudio()" id="audio-toggle-btn" style="background:var(--accent-red); border:none; color:#fff; padding:8px 16px; border-radius:4px; font-weight:700; cursor:pointer;">
                <i class="fa-solid fa-volume-high"></i> POČÚVAŤ
            </button>
        </div>

        <div id="matches-container">
            <div style="text-align:center; padding:30px; color:var(--text-muted);">Načítavam zápasy...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrbho9N3nrFwPyj9tNylBNh8fZ2MqBeHY",
            authDomain: "scorely-fff98.firebaseapp.com",
            databaseURL: "https://scorely-fff98-default-rtdb.firebaseio.com",
            projectId: "scorely-fff98",
            storageBucket: "scorely-fff98.firebasestorage.app",
            messagingSenderId: "1094795512385",
            appId: "1:1094795512385:web:2c4785b37cc7063bac14c0",
            measurementId: "G-CNFL3RQ8FL"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let audioContext = null;
        let isPlaying = false;

        db.ref('broadcast').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            const statusText = document.getElementById('broadcast-status-text');
            
            if (data.mode === 'mic') {
                statusText.innerText = "Živý komentár (Komentátor hovorí)";
                statusText.style.color = "#00e676";
            } else if (data.mode === 'music') {
                statusText.innerText = "Reklama / Hudobná prestávka";
                statusText.style.color = "#ffb300";
            } else {
                statusText.innerText = "Vysielanie je pozastavené";
                statusText.style.color = "#8c9ba5";
            }
        });

        db.ref('matches').on('value', (snapshot) => {
            const matches = snapshot.val() || {};
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            if (Object.keys(matches).length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">Žiadne aktívne zápasy</div>';
                return;
            }

            let html = '<div class="league-group"><div class="league-header"><i class="fa-solid fa-trophy"></i> Aktuálne Zápasy</div>';
            
            for (let id in matches) {
                const m = matches[id];
                const isLive = m.status === 'LIVE';
                
                html += `
                    <div class="match-row">
                        <div class="match-status ${isLive ? 'live' : ''}">${isLive ? m.time + "'" : m.status}</div>
                        <div class="teams">
                            <div class="team">${m.teamHome}</div>
                            <div class="team">${m.teamAway}</div>
                        </div>
                        <div class="score">
                            <div>${m.scoreHome}</div>
                            <div>${m.scoreAway}</div>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        });

        function toggleAudio() {
            const btn = document.getElementById('audio-toggle-btn');
            isPlaying = !isPlaying;
            if (isPlaying) {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> PAUZA';
                btn.style.background = '#444';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> POČÚVAŤ';
                btn.style.background = 'var(--accent-red)';
            }
        }
    </script>
</body>
  </html>
